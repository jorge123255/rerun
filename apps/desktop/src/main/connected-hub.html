<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Connect to Rerun</title>
    <link rel="stylesheet" href="startup.css">
    <link rel="stylesheet" href="connected-hub.css">
    <script defer src="connected-hub.js"></script>
</head>
<body class="auth-surface server-picker">
    <main>
        <img class="foreman" src="startup-assets/foreman.webp" alt="" width="56" height="57">
        <h1>Connect to Rerun</h1>
        <p>Open a Rerun server in its own window.</p>
        <form>
            <label for="server-address">Server address</label>
            <input id="server-address" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="rerun.example.com" autofocus required maxlength="2048">
            <p id="connection-error" role="alert" hidden></p>
            <button type="submit" disabled>Connect</button>
            <button type="button" id="connect-cloud" class="secondary">Use Rerun Cloud</button>
            <button type="button" id="cancel" class="secondary">Cancel</button>
        </form>
    </main>
</body>
</html>
