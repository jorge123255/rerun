<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Connect to Rerun</title>
    <link rel="stylesheet" href="startup.css">
    <link rel="stylesheet" href="connected-hub.css">
    <script defer src="connected-hub.js"></script>
</head>
<body class="auth-surface welcome server-picker">
    <div class="welcome-board" aria-hidden="true"></div>
    <main>
        <img class="foreman" src="startup-assets/foreman.webp" alt="" width="72" height="74">
        <div class="welcome-content">
            <h1>Connect to Rerun</h1>
            <form class="actions">
                <label for="server-address">Server address</label>
                <input id="server-address" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="rerun.example.com" autofocus required maxlength="2048">
                <p id="connection-error" class="connection-error" role="alert" hidden></p>
                <button type="submit" disabled>Connect</button>
                <div class="connection-options">
                    <button type="button" id="connect-cloud" class="text-action">Use Rerun Cloud</button>
                    <button type="button" id="cancel" class="text-action">Cancel</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
