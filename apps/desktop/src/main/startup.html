<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="startup.css">
  <title>Rerun Desktop Preview</title>
</head>
<body>
  <div id="mac-titlebar" aria-hidden="true" hidden></div>
  <main>
    <div class="mark" aria-hidden="true">↗</div>
    <p id="preview" class="eyebrow">DESKTOP PREVIEW</p>
    <h1><span id="heading-first">Your coworkers.</span><br><span id="heading-second">Your Mac.</span></h1>
    <p id="message" role="status">Preparing your local workspace…</p>
    <div class="actions">
      <button id="run-locally" hidden></button>
      <button id="sign-in-cloud" class="secondary" hidden></button>
      <button id="connect-server" class="secondary" hidden></button>
      <button id="retry" hidden>Try again</button>
      <button id="quit" class="secondary">Quit</button>
    </div>
    <p id="cloud-error" class="connection-error" role="alert" hidden></p>
    <p id="local-footnote" class="footnote">Your workspace and history stay on this Mac. AI providers use the network when you chat.</p>
  </main>
  <script src="startup.js"></script>
</body>
</html>
